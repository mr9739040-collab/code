name: codecollab
description: A real-time developer collaboration platform.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  provider: ^6.0.5
  shared_preferences: ^2.2.2

  uuid: ^4.4.0
  intl: ^0.19.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.4.10

  image_picker: ^1.0.7

  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/codecollab.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/